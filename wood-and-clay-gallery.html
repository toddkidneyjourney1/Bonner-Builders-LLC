<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wood & Clay Partnership Gallery | Bonner Builders LLC</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --page-max: 1280px;
      --gap-desktop: 24px;
      --gap-tablet: 16px;
      --gap-mobile: 12px;
      --card-radius: 12px;
      --card-blue: #162a45;
      --accent-gold: #f3c65f;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .portfolio-container {
      width: min(100% - 2rem, var(--page-max));
      margin: clamp(32px, 5vw, 48px) auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .back-nav {
      margin-bottom: -16px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef2f7;
      color: #162a45;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .back-btn:hover {
      background: var(--accent-gold);
    }

    .project-card {
      background: var(--card-blue);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: clamp(24px, 3.5vw, 36px);
      border-top: 6px solid var(--accent-gold);
    }

    .project-title {
      font-size: clamp(1.35rem, 2.2vw, 1.7rem);
      color: #ffffff;
      text-align: center;
      margin: 0 auto 28px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.18);
      font-weight: 700;
    }

    .partner-link {
      color: var(--accent-gold);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .partner-link:hover {
      color: #ffffff;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--gap-desktop);
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .grid-item {
      background: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .grid-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #243b5a;
      overflow: hidden;
    }

    /* Sequential Number Badge */
    .photo-number {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(22, 42, 69, 0.88);
      color: var(--accent-gold);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(243, 198, 95, 0.5);
      pointer-events: none;
      z-index: 2;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: transform 0.3s ease;
      display: block;
    }

    .img-wrapper img:hover {
      transform: scale(1.03);
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lightbox-content {
      position: relative;
      text-align: center;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 84vh;
      object-fit: contain;
      border: 3px solid #ffffff;
      border-radius: 6px;
      background: #111;
    }

    .lightbox-caption {
      color: var(--accent-gold);
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 12px;
    }

    @media (max-width: 1200px) { .project-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 900px) { .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap-tablet); } }
    @media (max-width: 560px) { .project-grid { grid-template-columns: 1fr; gap: var(--gap-mobile); } }
  </style>
</head>
<body>
  <header>
    <div class="logo-side">
      <img src="assets/logo.png" alt="Bonner Builders Logo" decoding="async" />
    </div>
    <div class="header-info">
      <h3>Bonner Builders LLC</h3>
      <p>📞 (603) 707-0049</p>
      <p>✉️ bonnerbuilders@yahoo.com</p>
      <p>📍 Lakes Region, NH</p>
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="services.html">Services</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="join.html">Join Us</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
  </nav>

  <main class="portfolio-container">
    <div class="back-nav">
      <a href="portfolio.html" class="back-btn">&larr; Back to Portfolio</a>
    </div>

    <section class="project-card">
      <h1 class="project-title">
        Partnership with <a href="https://www.woodandclay.com" class="partner-link" target="_blank" rel="noopener noreferrer">Wood & Clay, Inc.</a> — Lakes Region, NH
      </h1>
      <ul class="project-grid" id="gallery-grid">
        <!-- Images loaded dynamically via script -->
      </ul>
    </section>
  </main>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()" aria-hidden="true">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Expanded View" decoding="async" />
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <script>
    const images = [
      "assets/bb (1).jpg", "assets/bb (2).JPG", "assets/facebookpics (15).jpeg",
      "assets/bb (4).JPG", "assets/bb (5) - Copy.jpeg", "assets/bb (6) - Copy.JPG",
      "assets/bb (7).jpg", "assets/bb (8).jpg", "assets/bb (9).jpg",
      "assets/bb (10).jpg", "assets/bb (11).jpg", "assets/bb (12).jpg",
      "assets/bb (13).jpg", "assets/bb (23).jpg"
    ];

    const gridEl = document.getElementById("gallery-grid");
    const fragment = document.createDocumentFragment();
    let visibleCount = 0;

    images.forEach((src, index) => {
      const li = document.createElement("li");
      li.className = "grid-item";

      const wrapper = document.createElement("div");
      wrapper.className = "img-wrapper";

      // Sequential number label
      const badge = document.createElement("span");
      badge.className = "photo-number";
      const photoNum = index + 1;
      badge.textContent = `#${photoNum}`;

      const img = document.createElement("img");
      img.src = src;
      img.alt = `Wood and Clay project showcase image #${photoNum}`;
      img.loading = index < 4 ? "eager" : "lazy";
      img.decoding = "async";

      img.addEventListener("click", () => openLightbox(img.src, img.alt, badge.textContent));
      img.addEventListener("error", () => {
        li.remove();
        // Re-number remaining badges cleanly if any image fails to load
        document.querySelectorAll(".photo-number").forEach((el, idx) => {
          el.textContent = `#${idx + 1}`;
        });
      });

      wrapper.appendChild(badge);
      wrapper.appendChild(img);
      li.appendChild(wrapper);
      fragment.appendChild(li);
    });

    gridEl.appendChild(fragment);

    function openLightbox(src, alt, label) {
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox-img").alt = alt;
      document.getElementById("lightbox-caption").textContent = `Wood & Clay, Inc. — Photo ${label}`;
      document.getElementById("lightbox").style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });
  </script>
</body>
</html>
