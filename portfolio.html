  <style>
    .portfolio-grid-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .portfolio-item {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .portfolio-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #e5e7eb;
      overflow: hidden;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .img-wrapper img:hover {
      transform: scale(1.03);
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 85vh;
      text-align: center;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 4px;
    }

    @media (max-width: 900px) {
      .portfolio-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .portfolio-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    function buildImageAlt(src, index) {
      const filename = src.split('/').pop() || '';
      const baseName = filename.replace(/\.[^/.]+$/, '');
      const normalized = baseName
        .replace(/[._-]+/g, ' ')
        .replace(/[()]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return normalized ? `Portfolio ${normalized}` : `Portfolio image ${index + 1}`;
    }

    const gridEl = document.getElementById('portfolio-grid');
    portfolioItems.forEach((src, index) => {
      const li = document.createElement('li');
      li.className = 'portfolio-item';
      const imageAlt = buildImageAlt(src, index);
      li.innerHTML = `
        <div class="img-wrapper">
          <img src="${src}" alt="${imageAlt}" onclick="openLightbox(this.src, this.alt)" loading="lazy" decoding="async" width="1200" height="900">
        </div>
      `;
      gridEl.appendChild(li);
    });

    function openLightbox(imageSrc, imageAlt) {
      const lightboxImg = document.getElementById('lightbox-img');
      const lightbox = document.getElementById('lightbox');
      lightboxImg.src = imageSrc;
      lightboxImg.alt = imageAlt;
      lightbox.style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeLightbox();
      }
    });
