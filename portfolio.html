<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Bonner Builders LLC</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="images/bb_1.jpg" fetchpriority="high">
</head>
<body>
  <header>
    <div class="logo-side">
      <img src="images/logo.png" alt="Bonner Builders Logo" decoding="async">
    </div>
    <div class="header-info">
      <h3>Bonner Builders LLC</h3>
      <p>📞 (603) 707-0049</p>
      <p>✉️ bonnerbuilders@yahoo.com</p>
      <p>📍 Lakes Region, NH</p>
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="services.html">Services</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="join.html">Join Us</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
  </nav>

  <!-- Suggestion 1: Interactive Category Filters -->
  <div class="filter-container" style="text-align: center; margin: 20px 0;">
    <button class="filter-btn active" onclick="filterGallery('all')">All Work</button>
    <button class="filter-btn" onclick="filterGallery('framing')">Framing</button>
    <button class="filter-btn" onclick="filterGallery('decks')">Decks & Porches</button>
    <button class="filter-btn" onclick="filterGallery('interiors')">Interiors & Remodels</button>
  </div>

  <div class="carousel-container">
    <!-- Suggestion 3: Carousel Navigation Controls -->
    <button class="carousel-nav-btn prev-btn" onclick="scrollCarousel(-1)">&#10094;</button>
    
    <ul class="carousel-track" id="carousel">
      <!-- Suggestion 2: Contextual Captions & Suggestion 4: Blur-Up/Lazy Loading Strategy (Verified Working Images Only) -->
      <li class="carousel-item" data-category="framing">
        <div class="img-wrapper" style="background-color: #e5e7eb;">
          <img src="images/bb_1.jpg" alt="Custom framing and structural carpentry in the Lakes Region" onclick="openLightbox(this.src, this.alt)" loading="eager" fetchpriority="high" decoding="async" width="1200" height="900">
        </div>
        <p class="img-caption">Custom Structural Framing</p>
      </li>
      <li class="carousel-item" data-category="framing">
        <div class="img-wrapper" style="background-color: #e5e7eb;">
          <img src="images/bb_3.jpg" alt="Precision framing detail" onclick="openLightbox(this.src, this.alt)" loading="lazy" decoding="async" width="1200" height="900">
        </div>
        <p class="img-caption">Precision Framing Detail</p>
      </li>
      <li class="carousel-item" data-category="framing">
        <div class="img-wrapper" style="background-color: #e5e7eb;">
          <img src="images/bb_4.jpg" alt="New construction structural framing" onclick="openLightbox(this.src, this.alt)" loading="lazy" decoding="async" width="1200" height="900">
        </div>
        <p class="img-caption">New Construction Build-out</p>
      </li>
      <li class="carousel-item" data-category="framing">
        <div class="img-wrapper" style="background-color: #e5e7eb;">
          <img src="images/bb_5.jpg" alt="Heavy timber and wall framing" onclick="openLightbox(this.src, this.alt)" loading="lazy" decoding="async" width="1200" height="900">
        </div>
        <p class="img-caption">Wall Framing & Support</p>
      </li>
      <li class="carousel-item" data-category="decks">
        <div class="img-wrapper" style="background-color: #e5e7eb;">
          <img src="images/bb_7.jpg" alt="Custom outdoor deck construction" onclick="openLightbox(this.src, this.alt)" loading="lazy" decoding="async" width="1200" height="900">
        </div>
        <p class="img-caption">Custom Outdoor Deck</p>
      </li>
    </ul>

    <!-- Suggestion 3: Carousel Navigation Controls -->
    <button class="carousel-nav-btn next-btn" onclick="scrollCarousel(1)">&#10095;</button>
  </div>

  <!-- Lightbox Overlay -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Expanded View" decoding="async">
      <p id="lightbox-caption"></p>
    </div>
  </div>

  <script>
    function openLightbox(imageSrc, imageAlt) {
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');
      const lightbox = document.getElementById('lightbox');
      
      lightboxImg.src = imageSrc;
      lightboxCaption.textContent = imageAlt;
      lightbox.style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    function scrollCarousel(direction) {
      const carousel = document.getElementById('carousel');
      const scrollAmount = 350; // Pixels to scroll horizontally per click
      carousel.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function filterGallery(category) {
      const items = document.querySelectorAll('.carousel-item');
      const buttons = document.querySelectorAll('.filter-btn');

      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      items.forEach(item => {
        if (category === 'all' || item.getAttribute('data-category') === category) {
          item.style.display = 'inline-block';
        } else {
          item.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
