<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Bonner Builders LLC</title>
  <link rel="stylesheet" href="style.css" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GeneralContractor",
      "name": "Bonner Builders LLC",
      "image": "https://bonner-builders-llc.com/assets/logo.png",
      "telephone": "(603) 707-0049",
      "email": "bonnerbuilders@yahoo.com",
      "areaServed": "Lakes Region, NH",
      "url": "https://bonner-builders-llc.com"
    }
  </script>
  <style>
    :root {
      --page-max: 1280px;
      --gap-desktop: 24px;
      --gap-tablet: 16px;
      --gap-mobile: 12px;
      --card-radius: 12px;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .portfolio-container {
      width: min(100% - 2rem, var(--page-max));
      margin: clamp(24px, 4vw, 40px) auto;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .project-card {
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 3vw, 32px);
      transition: box-shadow 0.3s ease;
    }

    .project-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .project-title {
      font-size: clamp(1.3rem, 2vw, 1.6rem);
      color: #243041;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eef2f7;
      font-weight: 700;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--gap-desktop);
      list-style: none;
      padding: 0;
      margin: 0;
      align-items: stretch;
    }

    .grid-item {
      background: #f8fafc;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      will-change: transform;
    }

    .grid-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: linear-gradient(135deg, #eef2f7, #e5e7eb);
      overflow: hidden;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: transform 0.3s ease;
      display: block;
    }

    .img-wrapper img:hover {
      transform: scale(1.03);
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lightbox-content {
      width: min(96vw, 1600px);
      max-height: 92vh;
      text-align: center;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 6px;
      background: #111;
    }

    @media (max-width: 1200px) {
      .project-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .project-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--gap-tablet);
      }
    }

    @media (max-width: 560px) {
      .project-container {
        width: min(100% - 1rem, var(--page-max));
        margin: 16px auto 24px;
      }
      .project-grid {
        grid-template-columns: 1fr;
        gap: var(--gap-mobile);
      }
      .lightbox {
        padding: 10px;
      }
      .lightbox-content img {
        max-height: 82vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .grid-item, .img-wrapper img {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-side">
      <img src="assets/logo.png" alt="Bonner Builders Logo" decoding="async" />
    </div>
    <div class="header-info">
      <h3>Bonner Builders LLC</h3>
      <p>📞 (603) 707-0049</p>
      <p>✉️ bonnerbuilders@yahoo.com</p>
      <p>📍 Lakes Region, NH</p>
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="services.html">Services</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="join.html">Join Us</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
  </nav>

  <main class="portfolio-container" id="portfolio-container">
    <!-- Cards will be dynamically populated here -->
  </main>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()" aria-hidden="true">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Expanded View" decoding="async" />
    </div>
  </div>

  <script>
    // Define the 3 grouped cards with their respective headers and image lists
    const projectGroups = [
      {
        title: "Partnership with Wood & Clay, Inc. — Lakes Region, NH",
        images: [
          "assets/bb (1).jpg",
          "assets/bb (2).JPG",
          "assets/facebookpics (15).jpeg",
          "assets/bb (4).JPG",
          "assets/bb (5) - Copy.jpeg",
          "assets/bb (6) - Copy.JPG",
          "assets/bb (7).jpg",
          "assets/bb (8).jpg",
          "assets/bb (9).jpg",
          "assets/bb (10).jpg",
          "assets/bb (11).jpg",
          "assets/bb (12).jpg",
          "assets/bb (13).jpg",
          "assets/bb (23).jpg"
        ]
      },
      {
        title: "Squam Lake Project — Center Harbor, NH",
        images: [
          "assets/bb (14).jpg",
          "assets/bb (15).jpg",
          "assets/bb (16).jpg",
          "assets/bb (17).jpg",
          "assets/bb (18).jpg",
          "assets/bb (19).jpg",
          "assets/bb (20).jpg",
          "assets/bb (21).jpg",
          "assets/bb (22).jpg",
          "assets/bb (24).jpg",
          "assets/bb (26).jpg",
          "assets/bb (27).jpg",
          "assets/bb (28).jpg",
          "assets/bb (29).jpg",
          "assets/bb (30).jpg",
          "assets/bb (31).jpg"
        ]
      },
      {
        title: "Featured Gallery Collection",
        images: [
          "assets/facebookpics (10).jpeg",
          "assets/facebookpics (11).jpeg",
          "assets/facebookpics (12).jpeg",
          "assets/facebookpics (13).jpeg"
        ]
      }
    ];

    const containerEl = document.getElementById("portfolio-container");
    const fragment = document.createDocumentFragment();

    let globalIndex = 0;

    projectGroups.forEach((group) => {
      // Create main card wrapper
      const cardEl = document.createElement("section");
      cardEl.className = "project-card";

      // Create header for the card
      const headingEl = document.createElement("h2");
      headingEl.className = "project-title";
      headingEl.textContent = group.title;
      cardEl.appendChild(headingEl);

      // Create grid list for images
      const gridEl = document.createElement("ul");
      gridEl.className = "project-grid";

      group.images.forEach((src) => {
        const li = document.createElement("li");
        li.className = "grid-item";

        const wrapper = document.createElement("div");
        wrapper.className = "img-wrapper";

        const img = document.createElement("img");
        img.src = src;
        img.alt = `${group.title} photo`;
        
        // Optimization: eager load the first few images in the first card, lazy load the rest
        img.loading = globalIndex < 4 ? "eager" : "lazy";
        img.fetchPriority = globalIndex < 2 ? "high" : "low";
        img.decoding = "async";
        img.width = 1200;
        img.height = 900;

        img.addEventListener("click", () => openLightbox(img.src, img.alt));
        img.addEventListener("error", () => { li.remove(); });

        wrapper.appendChild(img);
        li.appendChild(wrapper);
        gridEl.appendChild(li);

        globalIndex++;
      });

      cardEl.appendChild(gridEl);
      fragment.appendChild(cardEl);
    });

    containerEl.appendChild(fragment);

    function openLightbox(imageSrc, imageAlt) {
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      lightboxImg.src = imageSrc;
      lightboxImg.alt = imageAlt;
      lightbox.style.display = "flex";
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      const lightbox = document.getElementById("lightbox");
      lightbox.style.display = "none";
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeLightbox();
    });
  </script>
</body>
</html>
