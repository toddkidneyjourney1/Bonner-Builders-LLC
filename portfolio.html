  <style>
    :root {
      --page-max: 1280px;
      --gap-desktop: 20px;
      --gap-tablet: 16px;
      --gap-mobile: 12px;
      --card-radius: 10px;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 8px 20px rgba(0, 0, 0, 0.14);
    }

    .portfolio-grid-container {
      width: min(100% - 2rem, var(--page-max));
      margin: clamp(20px, 3vw, 36px) auto;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--gap-desktop);
      list-style: none;
      padding: 0;
      margin: 0;
      align-items: stretch;
    }

    .portfolio-item {
      background: #fff;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      will-change: transform;
    }

    .portfolio-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: linear-gradient(135deg, #eef2f7, #e5e7eb);
      overflow: hidden;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: transform 0.3s ease;
      display: block;
    }

    .img-wrapper img:hover {
      transform: scale(1.03);
    }

    .caption {
      padding: 10px 12px 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #243041;
      text-align: center;
      background: #fff;
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lightbox-content {
      width: min(96vw, 1600px);
      max-height: 92vh;
      text-align: center;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 6px;
      background: #111;
    }

    @media (max-width: 1200px) {
      .portfolio-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--gap-desktop);
      }
    }

    @media (max-width: 900px) {
      .portfolio-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--gap-tablet);
      }
    }

    @media (max-width: 560px) {
      .portfolio-grid-container {
        width: min(100% - 1rem, var(--page-max));
        margin: 16px auto 22px;
      }

      .portfolio-grid {
        grid-template-columns: 1fr;
        gap: var(--gap-mobile);
      }

      .lightbox {
        padding: 10px;
      }

      .lightbox-content img {
        max-height: 82vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .portfolio-item,
      .img-wrapper img {
        transition: none;
      }
    }
  </style>
</head>
