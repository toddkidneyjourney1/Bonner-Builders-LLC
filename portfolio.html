<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Bonner Builders LLC</title>
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "GeneralContractor",
    "name": "Bonner Builders LLC",
    "image": "https://bonner-builders-llc.com/assets/logo.png",
    "telephone": "(603) 707-0049",
    "email": "bonnerbuilders@yahoo.com",
    "areaServed": "Lakes Region, NH",
    "url": "https://bonner-builders-llc.com"
  }
  </script>
  <style>
    .portfolio-grid-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .portfolio-item {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .portfolio-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #e5e7eb;
      overflow: hidden;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .img-wrapper img:hover {
      transform: scale(1.03);
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 85vh;
      text-align: center;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 4px;
    }

    @media (max-width: 900px) {
      .portfolio-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .portfolio-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-side">
      <img src="assets/logo.png" alt="Bonner Builders Logo" decoding="async">
    </div>
    <div class="header-info">
      <h3>Bonner Builders LLC</h3>
      <p>📞 (603) 707-0049</p>
      <p>✉️ bonnerbuilders@yahoo.com</p>
      <p>📍 Lakes Region, NH</p>
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="services.html">Services</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="join.html">Join Us</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
  </nav>

  <div class="portfolio-grid-container">
    <ul class="portfolio-grid" id="portfolio-grid"></ul>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Expanded View" decoding="async">
    </div>
  </div>

  <script>
    const portfolioItems = [
      { src: 'assets/bb (1).jpg', alt: 'Custom home framing during early construction' },
      { src: 'assets/frame1.jpg.jpg', alt: 'Residential framing skeleton and wall layout' },
      { src: 'assets/bb (10).jpg', alt: 'Precision framing detail with beam layout' },
      { src: 'assets/bb (11).jpg', alt: 'New construction framing with wall sections in place' },
      { src: 'assets/bb (12).jpg', alt: 'Wall framing and structural support details' },
      { src: 'assets/bb (13).jpg', alt: 'Framing progress on active jobsite' },
      { src: 'assets/bb (14).jpg', alt: 'Custom carpentry and structural woodwork' },
      { src: 'assets/bb (15).jpg', alt: 'Structural carpentry elements in place' },
      { src: 'assets/bb (16).jpg', alt: 'Jobsite framing progress with materials staged' },
      { src: 'assets/bb (17).jpg', alt: 'Framework installation underway' },
      { src: 'assets/bb (18).jpg', alt: 'Construction stage showing framed structure' },
      { src: 'assets/bb (19).jpg', alt: 'Lakes Region residential build in progress' },
      { src: 'assets/bb (20).jpg', alt: 'Framing detail with structural elements' },
      { src: 'assets/bb (21).jpg', alt: 'Roof and wall framing on a custom build' },
      { src: 'assets/bb (22).jpg', alt: 'Subfloor and framing structure preparation' },
      { src: 'assets/bb (23).jpg', alt: 'Custom outdoor deck construction near completion' },
      { src: 'assets/bb (24).jpg', alt: 'Porch and deck layout for an outdoor living space' },
      { src: 'assets/bb (26).jpg', alt: 'Interior home renovation with updated finishes' },
      { src: 'assets/bb (30).jpg', alt: 'Custom pool project during early phase construction' },
      { src: 'assets/bb (7).jpg', alt: 'Pool build detail showing surrounding site work' },
      { src: 'assets/bb (8).jpg', alt: 'Custom pool installation in progress' },
      { src: 'assets/bb (9).jpg', alt: 'Outdoor pool setup with living area integration' }
    ];

    const gridEl = document.getElementById('portfolio-grid');
    portfolioItems.forEach(item => {
      const li = document.createElement('li');
      li.className = 'portfolio-item';
      li.innerHTML = `
        <div class="img-wrapper">
          <img src="${item.src}" alt="${item.alt}" onclick="openLightbox(this.src, this.alt)" loading="lazy" decoding="async" width="1200" height="900">
        </div>
      `;
      gridEl.appendChild(li);
    });

    function openLightbox(imageSrc, imageAlt) {
      const lightboxImg = document.getElementById('lightbox-img');
      const lightbox = document.getElementById('lightbox');
      lightboxImg.src = imageSrc;
      lightboxImg.alt = imageAlt;
      lightbox.style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
